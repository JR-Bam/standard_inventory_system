<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>User</title></head>
<body>
<div layout:fragment="content">

    <div class="detail-header">
        <div class="detail-header-left">
            <a class="icon-back" th:href="@{/users}" title="Back to users">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div>
                <h2 class="detail-title"
                    th:text="${mode == 'create'} ? 'New User' : 'Edit User'">User</h2>
                <div class="detail-subtitle"
                     th:text="${mode == 'create'} ? 'Provision a new account' : 'Update user details'">
                    Subtitle
                </div>
            </div>
        </div>
    </div>

    <form method="post"
          th:action="${mode == 'create'} ? @{/users} : @{/users/{id}(id=${form.id})}"
          th:object="${form}"
          class="surface-card"
          style="max-width: 720px;">

        <div class="surface-header">
            <span class="material-symbols-outlined">person</span>
            <h6>Account Details</h6>
        </div>

        <div class="surface-body">

            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <span class="material-symbols-outlined icon-sm me-1">error</span>
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">error</span>
            </div>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label" for="username">Username <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="username" th:field="*{username}"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           placeholder="jdoe"/>
                    <div class="invalid-feedback" th:errors="*{username}">error</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="fullName">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           placeholder="Juan Dela Cruz"/>
                    <div class="invalid-feedback" th:errors="*{fullName}">error</div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="juan@company.com"/>
                    <div class="invalid-feedback" th:errors="*{email}">error</div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="role">Role <span class="text-danger">*</span></label>
                    <select class="form-select" id="role" th:field="*{role}"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                        <option value="">— Select —</option>
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r}">Role</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}">error</div>
                </div>

                <div class="col-md-6 d-flex align-items-end">
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabled"/>
                        <label class="form-check-label" for="enabled">
                            Enabled — user can sign in
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============== Password ============== -->
        <div class="surface-header">
            <span class="material-symbols-outlined">lock</span>
            <h6 th:text="${mode == 'create'} ? 'Temporary Password' : 'Password (leave blank to keep current)'">Password</h6>
        </div>

        <div class="surface-body">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="password">
                        <span th:if="${mode == 'create'}">Password <span class="text-danger">*</span></span>
                        <span th:if="${mode == 'edit'}">New Password</span>
                    </label>
                    <input type="password" class="form-control" id="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           autocomplete="new-password"
                           th:placeholder="${mode == 'create'} ? 'At least 8 characters' : 'Leave blank to keep unchanged'"/>
                    <div class="invalid-feedback" th:errors="*{password}">error</div>
                    <div class="form-text" th:if="${mode == 'create'}">
                        Share this temporary password with the user out-of-band. They will be prompted to change it on first login.
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{forcePasswordChange}"
                               id="forcePasswordChange"/>
                        <label class="form-check-label" for="forcePasswordChange">
                            Require password change on next login
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions px-4 pb-4 pt-3">
            <a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a>
            <button class="btn btn-primary" type="submit">
                <span class="material-symbols-outlined icon-sm me-1">check</span>
                Save
            </button>
        </div>
    </form>
</div>
</body>
</html>
