<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Category</title></head>
<body>
<div layout:fragment="content">

    <div class="detail-header">
        <div class="detail-header-left">
            <a class="icon-back" th:href="@{/categories}" title="Back to categories">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div>
                <h2 class="detail-title" th:text="${mode == 'create'} ? 'New Category' : 'Edit Category'">
                    Category
                </h2>
                <div class="detail-subtitle"
                     th:text="${mode == 'create'} ? 'Add a new category to organize items' : 'Update this category'">
                    Subtitle
                </div>
            </div>
        </div>
    </div>

    <form method="post"
          th:action="${mode == 'create'} ? @{/categories} : @{/categories/{id}(id=${form.id})}"
          th:object="${form}"
          class="surface-card"
          style="max-width: 720px;">

        <div class="surface-header">
            <span class="material-symbols-outlined">edit_note</span>
            <h6>Category Details</h6>
        </div>

        <div class="surface-body">

            <div class="mb-3">
                <label class="form-label" for="name">Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                       placeholder="e.g., Laptops"/>
                <div class="invalid-feedback" th:errors="*{name}">error</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" id="description" rows="3" th:field="*{description}"
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                          placeholder="Optional notes about this category"></textarea>
                <div class="invalid-feedback" th:errors="*{description}">error</div>
            </div>

            <div class="form-check form-switch" th:if="${mode == 'edit'}">
                <input class="form-check-input" type="checkbox" th:field="*{active}" id="active"/>
                <label class="form-check-label" for="active">Active</label>
            </div>
        </div>

        <div class="form-actions px-4 pb-4 pt-3">
            <a class="btn btn-outline-secondary" th:href="@{/categories}">Cancel</a>
            <button class="btn btn-primary" type="submit">
                <span class="material-symbols-outlined icon-sm me-1">check</span>
                Save
            </button>
        </div>
    </form>
</div>
</body>
</html>
