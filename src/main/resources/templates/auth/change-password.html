<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Change Password</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
          rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">

<div class="container" style="max-width: 480px;">
    <div class="surface-card">

        <div class="surface-header">
            <span class="material-symbols-outlined" th:text="${forced} ? 'key' : 'lock'">lock</span>
            <h6 th:text="${forced} ? 'Change Your Password' : 'Change Password'">Password</h6>
        </div>

        <div class="surface-body">

            <div th:if="${forced}" class="inactive-banner mb-3">
                <span class="material-symbols-outlined">info</span>
                <div class="inactive-banner-text">
                    <strong>Your password must be changed before you can continue.</strong>
                    Choose a new password below.
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}">ok</span>
            </div>

            <form method="post" th:action="@{/account/change-password}" th:object="${form}">

                <!-- Global errors MUST be inside the form (th:object scope) -->
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <span class="material-symbols-outlined icon-sm me-1">error</span>
                    <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">error</span>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="currentPassword">
                        Current Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="currentPassword"
                           th:field="*{currentPassword}"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                           autocomplete="current-password" autofocus/>
                    <div class="invalid-feedback" th:errors="*{currentPassword}">error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="newPassword">
                        New Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="newPassword"
                           th:field="*{newPassword}"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                           autocomplete="new-password"
                           placeholder="At least 8 characters"/>
                    <div class="invalid-feedback" th:errors="*{newPassword}">error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">
                        Confirm New Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="confirmPassword"
                           th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           autocomplete="new-password"/>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}">error</div>
                </div>

                <div class="form-actions" style="padding: 0; border-top: none; margin-top: 1rem;">
                    <button class="btn btn-primary" type="submit">
                        <span class="material-symbols-outlined icon-sm me-1">check</span>
                        Change Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
