<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE - [Company] Inventory System">[Company] Inventory System</title>

    <!-- MDB CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css"
          rel="stylesheet"/>

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
          rel="stylesheet"/>

    <!-- Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
          rel="stylesheet"/>

    <!-- Theme -->
    <link th:href="@{/css/app.css}" rel="stylesheet"/>

    <link rel="preload" as="image" href="/images/sidebar-bg.jpg"/>
</head>
<body>

<!-- Top Bar -->
<header class="top-bar">
    <button class="hamburger-btn" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
        <span class="material-symbols-outlined">menu</span>
    </button>
    <a class="brand" th:href="@{/}">
        <span class="material-symbols-outlined">inventory_2</span>
        <span class="brand-text">
            <span class="brand-company">[Company]</span>
            <span class="brand-product">Inventory System</span>
        </span>
    </a>
    <div class="ms-auto d-flex align-items-center" sec:authorize="isAuthenticated()">
        <span class="text-light me-3 d-none d-md-inline">
            <span class="material-symbols-outlined icon-sm">person</span>
            <span sec:authentication="name">user</span>
        </span>
        <a class="btn btn-sm btn-outline-light me-2 d-none d-md-inline-flex"
           th:href="@{/account/change-password}"
           title="Change password">
            <span class="material-symbols-outlined icon-sm">lock_reset</span>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-sm btn-outline-light" type="submit">
                <span class="material-symbols-outlined icon-sm">logout</span>
                <span class="d-none d-md-inline">Logout</span>
            </button>
        </form>
    </div>
</header>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar" sec:authorize="isAuthenticated()">
    <ul class="sidebar-nav">
        <li class="nav-item">
            <a th:href="@{/}"
               th:classappend="${currentUri == '/'} ? 'active'"
               data-mdb-ripple-init
               data-mdb-ripple-color="light">
                <span class="material-symbols-outlined nav-icon">dashboard</span>
                <span class="nav-text">Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/items}"
               th:classappend="${#strings.startsWith(currentUri, '/items')} ? 'active'"
               data-mdb-ripple-init
               data-mdb-ripple-color="light">
                <span class="material-symbols-outlined nav-icon">inventory</span>
                <span class="nav-text">Items</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/categories}"
               th:classappend="${#strings.startsWith(currentUri, '/categories')} ? 'active'"
               data-mdb-ripple-init
               data-mdb-ripple-color="light">
                <span class="material-symbols-outlined nav-icon">sell</span>
                <span class="nav-text">Categories</span>
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/logs}"
               th:classappend="${#strings.startsWith(currentUri, '/logs')} ? 'active'"
               data-mdb-ripple-init
               data-mdb-ripple-color="light">
                <span class="material-symbols-outlined nav-icon">receipt_long</span>
                <span class="nav-text">Logs</span>
            </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/users}"
               th:classappend="${#strings.startsWith(currentUri, '/users')} ? 'active'"
               data-mdb-ripple-init
               data-mdb-ripple-color="light">
                <span class="material-symbols-outlined nav-icon">group</span>
                <span class="nav-text">Users</span>
            </a>
        </li>
    </ul>
</aside>

<!-- Mobile backdrop -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Main Content -->
<main class="main-content" id="mainContent">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">ok</span>
        <button type="button" class="btn-close" data-mdb-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">error</span>
        <button type="button" class="btn-close" data-mdb-dismiss="alert" aria-label="Close"></button>
    </div>

    <div layout:fragment="content"></div>
</main>

<!-- MDB JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

<script th:src="@{/js/charts.js}"></script>

<!-- Sidebar toggle logic -->
<script>
    (function () {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleBtn = document.getElementById('sidebarToggle');
        const backdrop = document.getElementById('sidebarBackdrop');

        if (!sidebar || !toggleBtn) return;

        const isMobile = () => window.innerWidth <= 768;

        // Restore collapsed state on desktop
        if (!isMobile() && localStorage.getItem('sidebarCollapsed') === 'true') {
            sidebar.classList.add('collapsed');
            mainContent.classList.add('sidebar-collapsed');
        }

        toggleBtn.addEventListener('click', function () {
            if (isMobile()) {
                const isOpen = sidebar.classList.toggle('mobile-open');
                backdrop.classList.toggle('show', isOpen);
            } else {
                const isCollapsed = sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('sidebar-collapsed', isCollapsed);
                localStorage.setItem('sidebarCollapsed', isCollapsed);
            }
        });

        backdrop.addEventListener('click', function () {
            sidebar.classList.remove('mobile-open');
            backdrop.classList.remove('show');
        });

        window.addEventListener('resize', function () {
            if (!isMobile()) {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('show');
            }
        });
    })();

    (function () {
        const topBar = document.querySelector('.top-bar');
        if (!topBar) return;

        const onScroll = () => {
            topBar.classList.toggle('is-scrolled', window.scrollY > 0);
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    })();
</script>

</body>
</html>
