spring:
  application:
    name: inventory-system
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  web:
    locale: en-PH
    locale-resolver: fixed
  Jackson:
    time-zone: Asia/Manila
    date-format: "MMM d, yyyy h:mm a"

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.springframework.security: INFO
    com.example.inventory: DEBUG